<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERA — Session Report</title>
  <link rel="stylesheet" href="/static/css/vera.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="/static/js/session.js"></script>
  <style>
    body { overflow: auto; background: #060A0F; }
    .report-wrap { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .report-title { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; }
    .report-title .v-gold {
      background: linear-gradient(135deg, #D4AF37, #F5D060);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .report-meta { font-size: 0.8rem; color: #86948a; margin-top: 0.3rem; }
    .report-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .report-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.8rem;
      font-weight: 600; border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-pdf { background: linear-gradient(135deg, #D4AF37, #F5D060); color: #0A0A0A; }
    .btn-pdf:hover { box-shadow: 0 0 20px rgba(212,175,55,0.3); }
    .btn-csv { background: transparent; color: #bbcabf; border: 1px solid rgba(60,74,66,0.3); }
    .btn-csv:hover { background: rgba(255,255,255,0.04); }
    .btn-home { background: transparent; color: #10B981; border: 1px solid rgba(16,185,129,0.3); }
    .btn-home:hover { background: rgba(16,185,129,0.08); }
    .report-card {
      background: rgba(15,20,25,0.75); border: 1px solid rgba(60,74,66,0.3);
      border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .card-heading { font-family: 'Inter', sans-serif; font-weight: 600; margin-bottom: 1rem; font-size: 1rem; }
    .score-container { display: flex; align-items: center; gap: 2rem; }
    .score-visual { text-align: center; }
    .score-number { font-family: 'Cinzel', serif; font-size: 2.5rem; font-weight: 700; color: #DFE3EA; margin-top: 0.5rem; }
    .score-label { font-size: 0.75rem; color: #86948a; }
    .score-badge {
      display: inline-block; padding: 0.5rem 1.2rem;
      border-radius: 20px; font-size: 0.9rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .score-badge.clean { background: rgba(16,185,129,0.15); color: #10B981; }
    .score-badge.low { background: rgba(59,130,246,0.15); color: #3B82F6; }
    .score-badge.medium { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .score-badge.high { background: rgba(239,68,68,0.15); color: #EF4444; }
    .score-summary { font-size: 0.85rem; color: #bbcabf; margin-top: 1rem; }
    .flag-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; }
    .flag-table th { text-align: left; padding: 0.6rem; color: #86948a; font-weight: 500; border-bottom: 1px solid rgba(60,74,66,0.3); }
    .flag-table td { padding: 0.6rem; border-bottom: 1px solid rgba(60,74,66,0.15); }
    .transcript-toggle { cursor: pointer; user-select: none; }
    .transcript-toggle:hover { color: #10B981; }
    .loading-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 3rem; font-size: 1rem; color: #86948a;
    }
    .loading-spinner::before {
      content: ''; width: 24px; height: 24px; border: 3px solid rgba(16,185,129,0.2);
      border-top-color: #10B981; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="report-wrap">
    <!-- Loading state -->
    <div id="report-loading" class="loading-spinner">Loading session report...</div>

    <!-- Main content (hidden until loaded) -->
    <div id="report-content" style="display:none;">
      <!-- Header -->
      <div class="report-header">
        <div>
          <h1 class="report-title"><span class="v-gold">V</span>ERA Session Report</h1>
          <p class="report-meta" id="report-meta">Session: ... | Date: ...</p>
        </div>
        <div class="report-actions no-print">
          <button class="report-btn btn-pdf" onclick="downloadPDF()">📄 PDF</button>
          <button class="report-btn btn-csv" onclick="downloadCSV()">📊 CSV</button>
          <button class="report-btn btn-home" onclick="window.location.href='/'">← Home</button>
        </div>
      </div>

      <!-- Risk Score Summary -->
      <div class="report-card">
        <div class="score-container">
          <div class="score-visual">
            <canvas id="final-gauge" width="160" height="100"></canvas>
            <div class="score-number" id="final-score">0</div>
            <div class="score-label">Final Risk Score</div>
          </div>
          <div>
            <span id="final-severity" class="score-badge clean">CLEAN</span>
            <div class="score-summary" id="final-summary"></div>
          </div>
        </div>
      </div>

      <!-- Timeline Chart -->
      <div class="report-card">
        <h3 class="card-heading">📈 Risk Score Timeline</h3>
        <canvas id="timeline-chart" height="200"></canvas>
      </div>

      <!-- Flag Breakdown -->
      <div class="report-card">
        <h3 class="card-heading">🚩 Flag Breakdown</h3>
        <div id="flag-table"></div>
      </div>

      <!-- Behavioral Averages (Radar) -->
      <div class="report-card">
        <h3 class="card-heading">🎯 Behavioral Signal Averages</h3>
        <div style="max-width:400px;margin:0 auto;">
          <canvas id="radar-chart" height="300"></canvas>
        </div>
      </div>

      <!-- Transcript -->
      <div class="report-card">
        <h3 class="card-heading transcript-toggle" onclick="toggleTranscript()">💬 Transcript ▾</h3>
        <div id="transcript-content" class="hidden" style="max-height:300px;overflow-y:auto;white-space:pre-wrap;font-size:0.85rem;color:#bbcabf;"></div>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session') || '';
    var reportData = null;
    var _reportRetries = 0;
    var _maxReportRetries = 15;

    async function loadReport() {
      if (!sessionId) {
        document.getElementById('report-loading').textContent = 'No session ID provided.';
        return;
      }

      try {
        var resp = await fetch('/report/' + sessionId);
        if (!resp.ok) {
          if (_reportRetries < _maxReportRetries) {
            _reportRetries += 1;
            document.getElementById('report-loading').textContent =
              'Finalizing session report... (' + _reportRetries + '/' + _maxReportRetries + ')';
            setTimeout(loadReport, 700);
            return;
          }
          document.getElementById('report-loading').textContent =
            'Report is not available yet. Please refresh in a few seconds.';
          return;
        }

        // Show content, hide loading
        document.getElementById('report-loading').style.display = 'none';
        document.getElementById('report-content').style.display = 'block';

        reportData = await resp.json();
        var summary = reportData.summary || {};
        var results = reportData.results || [];
        var trend = summary.deception_trend || [];

        // Meta
        document.getElementById('report-meta').textContent =
          'Session: ' + sessionId + ' | Date: ' + new Date().toLocaleDateString() +
          ' | Frames analyzed: ' + (summary.total_frames || results.length) +
          ' | Duration: ' + formatDuration(summary.session_duration_s || 0);

        // Score
        var score = Math.round(summary.final_score || 0);
        document.getElementById('final-score').textContent = score;
        drawGauge(score);

        // Severity
        var sev = (summary.severity || 'CLEAN').toLowerCase();
        var badge = document.getElementById('final-severity');
        badge.textContent = (summary.severity || 'CLEAN');
        badge.className = 'score-badge ' + sev;

        // Summary text
        var activeFlags = summary.active_flags || [];
        var seenFlags = summary.all_signals_seen || [];
        document.getElementById('final-summary').textContent =
          'Active flags: ' + (activeFlags.join(', ') || 'None') +
          ' | Signals seen: ' + seenFlags.length +
          '. Alerts: ' + ((summary.alerts || []).length || 0) +
          '. Context: ' + (summary.context || 'N/A');

        // Timeline chart
        if (results.length > 0 || trend.length > 0) {
          var chartData = results.length > 0
            ? results.map(function(r) { return r.deception || 0; })
            : trend;
          var labels = chartData.map(function(_, i) { return i; });
          new Chart(document.getElementById('timeline-chart'), {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: 'Risk Score',
                data: chartData,
                borderColor: '#10B981',
                backgroundColor: 'rgba(16,185,129,0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 0
              }]
            },
            options: {
              responsive: true,
              plugins: {legend: {display: false}},
              scales: {
                y: {min: 0, max: 100, ticks: {color: 'rgba(187,202,191,0.4)'}},
                x: {display: false}
              }
            }
          });
        }

        // Flag table
        var flags = (summary.all_signals_seen && summary.all_signals_seen.length > 0)
          ? summary.all_signals_seen
          : (summary.active_flags || []);
        var activeLookup = {};
        (summary.active_flags || []).forEach(function(f) { activeLookup[f] = true; });
        var flagHtml = '<table class="flag-table">' +
          '<tr><th>Flag</th><th>Status</th></tr>';
        if (flags.length === 0) {
          flagHtml += '<tr><td colspan="2" style="opacity:0.4;">No flags recorded</td></tr>';
        } else {
          flags.forEach(function(f) {
            var status = activeLookup[f] ? 'Active' : 'Seen in session';
            var color = activeLookup[f] ? '#EF4444' : '#D4AF37';
            flagHtml += '<tr><td>' + f.replace(/_/g, ' ') + '</td><td style="color:' + color + ';font-weight:600;">' + status + '</td></tr>';
          });
        }
        flagHtml += '</table>';
        document.getElementById('flag-table').innerHTML = flagHtml;

        // Radar chart
        var emotions = {};
        results.forEach(function(r) {
          var e = r.emotion || 'neutral';
          emotions[e] = (emotions[e] || 0) + 1;
        });
        var radarLabels = Object.keys(emotions);
        var radarData = radarLabels.map(function(l) { return emotions[l]; });
        if (radarLabels.length > 0) {
          new Chart(document.getElementById('radar-chart'), {
            type: 'radar',
            data: {
              labels: radarLabels,
              datasets: [{
                label: 'Frequency',
                data: radarData,
                borderColor: '#10B981',
                backgroundColor: 'rgba(16,185,129,0.15)',
                pointBackgroundColor: '#D4AF37'
              }]
            },
            options: {
              responsive: true,
              plugins: {legend: {display: false}},
              scales: {r: {ticks: {color: 'rgba(187,202,191,0.4)'}, grid: {color: 'rgba(60,74,66,0.3)'}}}
            }
          });
        }

        // Transcript
        var transcriptEl = document.getElementById('transcript-content');
        if (summary.audio_transcription) {
          transcriptEl.textContent = summary.audio_transcription;
        } else {
          transcriptEl.textContent = 'No transcript available.';
        }
        transcriptEl.classList.remove('hidden');
      } catch(e) {
        console.error('Failed to load report:', e);
        document.getElementById('report-loading').textContent = 'Error loading report: ' + e.message;
      }
    }

    function formatDuration(seconds) {
      var s = Math.round(seconds);
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (h > 0) return h + 'h ' + m + 'm ' + sec + 's';
      if (m > 0) return m + 'm ' + sec + 's';
      return sec + 's';
    }

    function drawGauge(score) {
      var canvas = document.getElementById('final-gauge');
      var ctx = canvas.getContext('2d');
      var cx = canvas.width / 2;
      var cy = canvas.height - 5;
      var r = 60;

      // Background arc
      ctx.beginPath();
      ctx.arc(cx, cy, r, Math.PI, 0, false);
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(60,74,66,0.3)';
      ctx.stroke();

      // Score arc
      var angle = Math.PI + (score / 100) * Math.PI;
      var color = score < 25 ? '#10B981' : score < 50 ? '#D4AF37' : score < 75 ? '#F59E0B' : '#EF4444';
      ctx.beginPath();
      ctx.arc(cx, cy, r, Math.PI, angle, false);
      ctx.lineWidth = 10;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function toggleTranscript() {
      var el = document.getElementById('transcript-content');
      el.classList.toggle('hidden');
    }

    function downloadPDF() {
      if (!reportData) { alert('Report data not loaded.'); return; }
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF();
      var summary = reportData.summary || {};
      var score = Math.round(summary.final_score || 0);
      var severity = summary.severity || 'CLEAN';

      // Title
      doc.setFontSize(22);
      doc.setTextColor(16, 185, 129);
      doc.text('VERA Session Report', 20, 25);

      // Meta
      doc.setFontSize(10);
      doc.setTextColor(134, 148, 138);
      doc.text('Session: ' + sessionId, 20, 35);
      doc.text('Date: ' + new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(), 20, 41);
      doc.text('Frames Analyzed: ' + (summary.total_frames || 0), 20, 47);
      doc.text('Duration: ' + formatDuration(summary.session_duration_s || 0), 20, 53);

      // Separator
      doc.setDrawColor(60, 74, 66);
      doc.line(20, 58, 190, 58);

      // Risk Score
      doc.setFontSize(14);
      doc.setTextColor(223, 227, 234);
      doc.text('Final Risk Score: ' + score + ' / 100', 20, 68);

      // Severity
      var sevColor = severity === 'CLEAN' ? [16,185,129] : severity === 'LOW' ? [59,130,246] :
                     severity === 'MEDIUM' ? [245,158,11] : [239,68,68];
      doc.setTextColor(sevColor[0], sevColor[1], sevColor[2]);
      doc.text('Severity: ' + severity, 20, 76);

      // Flags
      var flags = summary.active_flags || [];
      doc.setFontSize(12);
      doc.setTextColor(223, 227, 234);
      doc.text('Active Flags:', 20, 90);
      doc.setFontSize(10);
      if (flags.length === 0) {
        doc.setTextColor(134, 148, 138);
        doc.text('No flags recorded', 25, 98);
      } else {
        var flagY = 98;
        flags.forEach(function(f) {
          doc.setTextColor(239, 68, 68);
          doc.text('• ' + f.replace(/_/g, ' '), 25, flagY);
          flagY += 7;
        });
      }

      // Alerts
      var alerts = summary.alerts || [];
      var alertY = Math.max(flagY || 98, 98) + 10;
      doc.setFontSize(12);
      doc.setTextColor(223, 227, 234);
      doc.text('Alert Count: ' + alerts.length, 20, alertY);

      // Context
      doc.setFontSize(10);
      doc.setTextColor(134, 148, 138);
      doc.text('Context: ' + (summary.context || 'N/A'), 20, alertY + 10);

      // Transcript
      if (summary.audio_transcription) {
        doc.addPage();
        doc.setFontSize(14);
        doc.setTextColor(16, 185, 129);
        doc.text('Transcript', 20, 25);
        doc.setFontSize(9);
        doc.setTextColor(187, 202, 191);
        var lines = doc.splitTextToSize(summary.audio_transcription, 170);
        doc.text(lines, 20, 35);
      }

      // Footer
      doc.setFontSize(8);
      doc.setTextColor(134, 148, 138);
      doc.text('Generated by VERA — Visual Expression & Response Analyzer', 20, 285);

      doc.save('VERA_Report_' + sessionId + '.pdf');
    }

    function downloadCSV() {
      if (!reportData || !reportData.results) { alert('No data to export.'); return; }
      var csv = Papa.unparse(reportData.results);
      var blob = new Blob([csv], {type: 'text/csv'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'VERA_Report_' + sessionId + '.csv';
      a.click();
    }

    loadReport();
  </script>
</body>
</html>
