<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERA — Proctor Review</title>
  <link rel="stylesheet" href="/static/css/vera.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="/static/js/session.js"></script>
</head>
<body style="overflow:auto;">
  <div class="flex h-screen">
    <!-- LEFT PANEL: Session List -->
    <div style="width:30%;border-right:1px solid rgba(255,255,255,0.05);overflow-y:auto;" class="p-4">
      <h2 class="text-xl font-bold mb-4">🔍 Proctor Review</h2>

      <!-- Filters -->
      <div class="flex gap-2 mb-4">
        <select id="severity-filter" class="rounded p-2 text-sm" style="background:rgba(255,255,255,0.05);color:#F1F5F9;border:1px solid rgba(255,255,255,0.1);">
          <option value="">All Severities</option>
          <option value="HIGH">HIGH</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="LOW">LOW</option>
          <option value="CLEAN">CLEAN</option>
        </select>
        <button class="btn btn-ghost text-sm" onclick="loadSessions()">Refresh</button>
      </div>

      <!-- Session list -->
      <div id="session-list" class="flex flex-col gap-2"></div>
    </div>

    <!-- RIGHT PANEL: Session Detail -->
    <div style="width:70%;overflow-y:auto;" class="p-6">
      <div id="detail-placeholder" class="flex items-center justify-center h-full opacity-40">
        <p>Select a session to review</p>
      </div>

      <div id="detail-content" class="hidden">
        <!-- Summary card -->
        <div class="glass-card p-6 mb-4">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-lg font-bold" id="detail-session-id">Session ID</h3>
              <p class="text-sm opacity-60" id="detail-context">Context: interview</p>
            </div>
            <div class="flex items-center gap-4">
              <div>
                <div class="text-sm opacity-60">Risk Score</div>
                <div class="text-2xl font-bold" id="detail-score">0</div>
              </div>
              <span id="detail-severity" class="badge badge-clean">CLEAN</span>
            </div>
          </div>
        </div>

        <!-- Timeline -->
        <div class="glass-card p-6 mb-4">
          <h4 class="font-semibold mb-4">📋 Event Timeline</h4>
          <div id="detail-timeline" style="max-height:300px;overflow-y:auto;"></div>
        </div>

        <!-- Signal breakdown chart -->
        <div class="glass-card p-6 mb-4">
          <h4 class="font-semibold mb-4">📊 Signal Breakdown</h4>
          <canvas id="signal-chart" height="200"></canvas>
        </div>

        <!-- Proctor Decision -->
        <div class="glass-card p-6 mb-4">
          <h4 class="font-semibold mb-4">⚖️ Proctor Decision</h4>
          <div class="flex gap-3 mb-4">
            <button class="btn btn-success" onclick="submitDecision('no_action')">No Action</button>
            <button class="btn btn-ghost" onclick="submitDecision('flag_review')" style="border-color:#F59E0B;color:#F59E0B;">Flag for Review</button>
            <button class="btn btn-danger" onclick="submitDecision('disqualify')">Disqualify</button>
          </div>
          <textarea id="proctor-notes" placeholder="Notes (optional)..."
            style="width:100%;height:80px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:0.75rem;color:#F1F5F9;font-family:Inter,sans-serif;resize:vertical;"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    SessionManager.init();
    var currentSessionId = null;
    var signalChart = null;

    async function loadSessions() {
      var filter = document.getElementById('severity-filter').value;
      var url = '/api/sessions';
      if (filter) url += '?severity=' + filter;

      try {
        var resp = await fetch(url);
        var sessions = await resp.json();
        var list = document.getElementById('session-list');
        list.innerHTML = '';

        sessions.forEach(function(s) {
          var sev = (s.severity || 'CLEAN').toLowerCase();
          var card = document.createElement('div');
          card.className = 'glass-card p-3 cursor-pointer hover-scale transition';
          card.innerHTML =
            '<div class="flex justify-between items-center">' +
              '<div>' +
                '<div class="text-sm font-semibold">' + s.session_id.substring(0,8) + '...</div>' +
                '<div class="text-xs opacity-60">' + s.context + '</div>' +
              '</div>' +
              '<span class="badge badge-' + sev + '">' + (s.severity || 'CLEAN') + '</span>' +
            '</div>';
          card.onclick = function() { loadDetail(s.session_id); };
          list.appendChild(card);
        });
      } catch(e) {
        console.error('Failed to load sessions:', e);
      }
    }

    async function loadDetail(sessionId) {
      currentSessionId = sessionId;
      document.getElementById('detail-placeholder').classList.add('hidden');
      document.getElementById('detail-content').classList.remove('hidden');

      try {
        var resp = await fetch('/report/' + sessionId);
        var data = await resp.json();

        document.getElementById('detail-session-id').textContent = sessionId;
        var summary = data.summary || {};
        document.getElementById('detail-score').textContent = Math.round(summary.final_score || 0);

        var sev = (summary.severity || 'CLEAN').toLowerCase();
        var badge = document.getElementById('detail-severity');
        badge.textContent = (summary.severity || 'CLEAN');
        badge.className = 'badge badge-' + sev;

        // Timeline from results
        var timeline = document.getElementById('detail-timeline');
        timeline.innerHTML = '';
        (data.results || []).slice(-50).forEach(function(r) {
          var row = document.createElement('div');
          row.className = 'timeline-row';
          row.innerHTML = '<span class="opacity-60">#' + r.frame_id + '</span>' +
                          '<span>' + (r.emotion || 'neutral') + '</span>' +
                          '<span>Risk: ' + Math.round(r.deception || 0) + '%</span>';
          timeline.appendChild(row);
        });

        // Signal chart
        if (summary.active_flags) {
          var labels = summary.active_flags;
          var values = labels.map(function() { return 1; });
          if (signalChart) signalChart.destroy();
          var ctx = document.getElementById('signal-chart').getContext('2d');
          signalChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{data: values, backgroundColor: 'rgba(239,68,68,0.5)', borderWidth: 0}]
            },
            options: {
              responsive: true,
              plugins: {legend: {display: false}},
              scales: {
                y: {display: false},
                x: {ticks: {color: 'rgba(255,255,255,0.5)', font: {size: 10}}}
              }
            }
          });
        }
      } catch(e) {
        console.error('Failed to load detail:', e);
      }
    }

    function submitDecision(decision) {
      var notes = document.getElementById('proctor-notes').value;
      alert('Decision "' + decision + '" recorded for session ' + currentSessionId + '.\nNotes: ' + (notes || '(none)'));
      // In production, this would POST to /api/review/{session_id}
    }

    document.getElementById('severity-filter').addEventListener('change', loadSessions);
    loadSessions();
  </script>
</body>
</html>
